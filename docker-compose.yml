# 로컬 개발용 MySQL, Redis (docker compose up -d)
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: village
      MYSQL_USER: village
      MYSQL_PASSWORD: village
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  mysql-data:
