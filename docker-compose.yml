# 로컬 개발용 PostgreSQL, Redis (docker compose up -d)
# 비밀번호는 .env 파일에서 읽습니다. .env.example을 복사해서 만드세요.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-village}
      POSTGRES_USER: ${DB_USERNAME:-village}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-village} -d ${DB_NAME:-village}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD를 .env에 설정하세요}"]
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  pg-data:
