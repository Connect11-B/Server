spring:
  application:
    name: village-server
  profiles:
    default: local
  jackson:
    time-zone: Asia/Seoul
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-seconds: 1800
  auth:
    code-pepper: ${AUTH_CODE_PEPPER}
    refresh-token-ttl-seconds: 1209600
  mail:
    mode: log
    from: ${MAIL_FROM:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
